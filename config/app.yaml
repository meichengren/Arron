# Application-level configuration
app:
  name: "Investment Research & Portfolio Quant Decision System"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8501

database:
  url: "sqlite:///data/investment.db"

data_source:
  # Free-source first: avoids an unavailable Tushare token adding latency.
  primary: "akshare"
  fallback: "tushare"
  # failover policy: try the fallback immediately after a source error.
  auto_failover: true
  request_timeout_seconds: 15

sync:
  # Keep sufficient history for valuation and risk calculations.
  market_history_years: 5
  financial_history_years: 5
  # Cache reports between disclosure periods; manual force-sync bypasses this.
  financial_cache_days: 7
  # Retry only failed/pending symbols without overwhelming free endpoints.
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  request_interval_seconds: 0.35
  # UI list cache; cleared immediately after a refresh or deletion.
  dashboard_cache_seconds: 30
  # financial data freshness threshold in days before warning
  financial_freshness_days: 120
  market_freshness_days: 3

seed_symbols:
  - "600036.SH"
  - "601318.SH"
  - "601138.SH"
  - "601899.SH"